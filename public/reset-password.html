<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civix — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  body{display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--steel-900);}
</style>
</head>
<body>
<div class="auth-box">
  <p class="modal__eyebrow">CIVIX</p>
  <h2>Set New Password</h2>
  <p class="sub">Enter your new password below</p>
  <input type="password" id="newPassword" placeholder="New password" minlength="6">
  <button class="btn btn--primary btn--block" id="resetBtn">Update Password</button>
  <p class="err" id="errBox" hidden></p>
  <p class="ok" id="okBox" hidden></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let supabase;

async function init() {
  const res = await fetch("/api/public-config");
  const config = await res.json();
  supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

  // Supabase automatically reads the recovery token from the URL hash
  supabase.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      console.log("Recovery session ready");
    }
  });
}
init();

document.getElementById("resetBtn").addEventListener("click", async () => {
  const newPassword = document.getElementById("newPassword").value;
  const errBox = document.getElementById("errBox");
  const okBox = document.getElementById("okBox");
  errBox.hidden = true;
  okBox.hidden = true;

  if (!newPassword || newPassword.length < 6) {
    errBox.textContent = "Password must be at least 6 characters";
    errBox.hidden = false;
    return;
  }

  const { error } = await supabase.auth.updateUser({ password: newPassword });
  if (error) {
    errBox.textContent = error.message;
    errBox.hidden = false;
    return;
  }
  okBox.textContent = "Password updated! You can now login.";
  okBox.hidden = false;
  setTimeout(() => { window.location.href = "/customer-auth.html"; }, 2000);
});
</script>
</body>
</html>
